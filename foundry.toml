[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
test = "test"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
fs_permissions = []

[fuzz]
runs = 256

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

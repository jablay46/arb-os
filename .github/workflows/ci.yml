name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `lib/` is gitignored and is not a submodule, so a fresh clone has no
      # forge-std and every contract fails to compile. The tag is pinned on
      # purpose: installing without one takes the default branch, which lets a
      # build break without anyone touching this repo.
      - run: forge install foundry-rs/forge-std@v1.16.2 --no-git

      - run: forge fmt --check
      # Exits 0 despite the documented warnings, so no --deny-warnings here.
      - run: forge lint
      - run: forge build

      # Fork tests need an archive RPC, so they run manually rather than here.
      # Deliberately no BASE_RPC_URL secret in CI: a pull request from a fork
      # can read secrets, and this job does not need one.
      - run: forge test --no-match-path "test/fork/*" -vv

  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:scanner
      # Only meaningful with tsconfig.json: without one, tsc prints its help
      # text and exits 0, so the job would be green without checking anything.
      - run: npx tsc --noEmit
